<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="job_application.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

<body><section>
   
    <div>
        

    <h1>job application <sub>(web)</sub></h1>
    </div>
    <div class="first_name">
        <label for="first">First name</label>
        <input type="text" id="first" placeholder="enter name">
    </div>
     <div class="last_name">
        <label for="last">last name</label>
        <input type="text" id="last" placeholder="last name">
    </div>
      <div class="email">
        <label for="email">Email</label>
        <input type="text" id="email" placeholder="enter email">
    </div><div>
    <label for="role">job role</label>
    <select name="" id="role">
        <option value="">web-dev</option>
        <option >java full stack</option>
        <option value="">python full stack</option>
        <option value="">cybersecurity</option>
        <option value="">ai-ml</option>

    </select>
    </div>
    <div class="address">
    <label for="address">address</label>
    <input type="address" id="address">
    </div>
    <div>
    <label for="city">city</label>
    <input type="text" id="city">
    </div>
    
    

    </section>
</body>
</html>
